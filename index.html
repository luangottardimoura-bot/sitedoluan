<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Aventura do Nico</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #5ec9ff;
}

button {
    font: inherit;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;

    background:
        linear-gradient(
            to bottom,
            #5ec9ff 0%,
            #a9e8ff 64%,
            #79c957 64%,
            #4ba83d 100%
        );
}

/* CENÁRIO */

.sun {
    position: absolute;
    width: 90px;
    height: 90px;
    top: 55px;
    right: 90px;
    background: #ffd83d;
    border-radius: 50%;
    box-shadow: 0 0 35px rgba(255,232,115,.8);
}

.cloud {
    position: absolute;
    width: 130px;
    height: 45px;
    background: #fff;
    border-radius: 50px;
    opacity: .9;
}

.cloud::before,
.cloud::after {
    content: "";
    position: absolute;
    background: #fff;
    border-radius: 50%;
}

.cloud::before {
    width: 55px;
    height: 55px;
    left: 20px;
    top: -25px;
}

.cloud::after {
    width: 70px;
    height: 70px;
    right: 15px;
    top: -35px;
}

.cloud1 {
    top: 110px;
    left: 15%;
}

.cloud2 {
    top: 190px;
    left: 55%;
    transform: scale(.8);
}

/* HUD */

#hud {
    position: fixed;
    z-index: 1000;
    top: 15px;
    left: 15px;
    padding: 12px 18px;
    color: #fff;
    background: rgba(0,0,0,.65);
    border: 2px solid rgba(255,255,255,.2);
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
    user-select: none;
}

/* MUNDO */

#world {
    position: absolute;
    left: 0;
    top: 0;
    width: 3000px;
    height: 100%;
    will-change: transform;
}

/* CHÃO */

.ground {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 3000px;
    height: 90px;

    background:
        repeating-linear-gradient(
            45deg,
            #55b947,
            #55b947 20px,
            #48a93c 20px,
            #48a93c 40px
        );

    border-top: 8px solid #34852d;
}

/* PLATAFORMAS */

.platform {
    position: absolute;
    height: 30px;
    background: #9b5b32;
    border: 5px solid #713c20;
    border-radius: 5px;
}

/* BLOCOS */

.block {
    position: absolute;
    width: 55px;
    height: 55px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #fff;
    background: #f4a62a;

    border: 5px solid #a85f12;
    border-radius: 6px;

    font-size: 25px;
    font-weight: bold;
}

/* MOEDAS */

.coin {
    position: absolute;
    width: 28px;
    height: 38px;

    background: #ffd928;
    border: 4px solid #c99600;
    border-radius: 50%;

    box-shadow: inset 5px 0 rgba(255,255,255,.4);

    animation: coinFloat .8s infinite alternate;
    pointer-events: none;
}

@keyframes coinFloat {
    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(-8px);
    }
}

/* NICO */

#player {
    position: absolute;

    width: 52px;
    height: 68px;

    z-index: 50;
    pointer-events: none;
}

.nico-hair {
    position: absolute;

    width: 42px;
    height: 20px;

    left: 5px;
    top: -3px;

    background: #174ea6;

    border-radius: 60% 60% 30% 30%;

    z-index: 3;
}

.nico-head {
    position: absolute;

    width: 38px;
    height: 38px;

    left: 7px;
    top: 3px;

    background: #ffc98f;

    border: 3px solid #713f2b;

    border-radius: 45% 45% 50% 50%;

    z-index: 2;
}

.nico-eye {
    position: absolute;

    width: 6px;
    height: 9px;

    top: 16px;

    background: #111;

    border-radius: 50%;
}

.nico-eye1 {
    left: 10px;
}

.nico-eye2 {
    right: 10px;
}

.nico-mouth {
    position: absolute;

    width: 12px;
    height: 6px;

    left: 11px;
    bottom: 7px;

    border-bottom: 3px solid #7b3028;

    border-radius: 50%;
}

.nico-body {
    position: absolute;

    width: 44px;
    height: 34px;

    left: 4px;
    bottom: 9px;

    background: #25a65a;

    border: 3px solid #146337;

    border-radius: 12px 12px 7px 7px;

    z-index: 1;
}

.nico-foot {
    position: absolute;

    width: 20px;
    height: 10px;

    bottom: 0;

    background: #5a3424;

    border: 2px solid #382015;

    border-radius: 10px;
}

.nico-foot1 {
    left: 5px;
}

.nico-foot2 {
    right: 5px;
}

/* BUBU */

.enemy.bubu {
    position: absolute;

    width: 52px;
    height: 42px;

    z-index: 40;

    background: #f07828;

    border: 4px solid #8c3516;

    border-radius: 55% 55% 35% 35%;

    pointer-events: none;

    box-shadow:
        inset 0 8px rgba(255,255,255,.08);
}

.horn-left,
.horn-right {
    position: absolute;

    width: 12px;
    height: 16px;

    top: -13px;

    background: #ffd447;

    border: 3px solid #8c3516;

    z-index: 1;
}

.horn-left {
    left: 4px;
    transform: rotate(-25deg);

    border-radius: 80% 20% 60% 20%;
}

.horn-right {
    right: 4px;
    transform: rotate(25deg);

    border-radius: 20% 80% 20% 60%;
}

.bubu-eye {
    position: absolute;

    width: 8px;
    height: 11px;

    top: 10px;

    background: #fff;

    border: 2px solid #54210f;

    border-radius: 50%;

    z-index: 3;
}

.bubu-eye::after {
    content: "";

    position: absolute;

    width: 3px;
    height: 6px;

    top: 1px;
    left: 1px;

    background: #111;

    border-radius: 50%;
}

.bubu-eye1 {
    left: 10px;
}

.bubu-eye2 {
    right: 10px;
}

.bubu-mouth {
    position: absolute;

    width: 18px;
    height: 8px;

    left: 13px;
    bottom: 6px;

    border-bottom: 3px solid #54210f;

    border-radius: 50%;
}

/* BANDEIRA */

#flag {
    position: absolute;

    width: 10px;
    height: 180px;

    z-index: 20;

    background: #eee;

    border-radius: 5px;
}

#flag::after {
    content: "🏁";

    position: absolute;

    top: -12px;
    left: 4px;

    font-size: 55px;
}

/* TELA FINAL */

#message {
    position: fixed;

    inset: 0;

    z-index: 2000;

    display: none;

    align-items: center;
    justify-content: center;
    flex-direction: column;

    padding: 20px;

    color: #fff;
    text-align: center;

    background: rgba(0,0,0,.78);
}

#message.show {
    display: flex;
}

#message h1 {
    margin-bottom: 15px;
    font-size: clamp(36px, 8vw, 60px);
}

#message p {
    font-size: 20px;
    margin-bottom: 25px;
}

#message button {
    padding: 14px 30px;

    color: #222;
    background: #ffd21f;

    border: none;
    border-radius: 10px;

    font-size: 20px;
    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 4px 0 #b18d00;
}

#message button:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #b18d00;
}

/* CONTROLES */

#controls {
    position: fixed;

    z-index: 1500;

    left: 0;
    bottom: 20px;

    width: 100%;

    display: none;

    justify-content: space-between;

    padding: 0 20px;

    pointer-events: none;
}

.control-group {
    display: flex;
    gap: 12px;
}

.control {
    width: 65px;
    height: 65px;

    color: #fff;

    background: rgba(0,0,0,.5);

    border: 3px solid rgba(255,255,255,.8);
    border-radius: 50%;

    font-size: 25px;

    cursor: pointer;

    touch-action: none;
    user-select: none;

    pointer-events: auto;
}

.control:active {
    background: rgba(255,255,255,.3);
    transform: scale(.95);
}

@media (max-width: 700px) {

    #controls {
        display: flex;
    }

    #hud {
        top: 10px;
        left: 10px;

        padding: 9px 12px;

        font-size: 14px;
    }

    .sun {
        width: 65px;
        height: 65px;

        top: 70px;
        right: 40px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .coin {
        animation: none;
    }
}
</style>
</head>

<body>

<div id="game">

    <div id="hud">

<script>
"use strict";

/* CONFIGURAÇÕES */

const WORLD_WIDTH = 3000;

const PLAYER_WIDTH = 52;
const PLAYER_HEIGHT = 68;

const GROUND_HEIGHT = 90;

const PLAYER_SPEED = 6;
const JUMP_POWER = 16;
const GRAVITY = 0.7;

const MAX_LIVES = 3;


/* ELEMENTOS */

const world = document.getElementById("world");
const player = document.getElementById("player");

const scoreElement = document.getElementById("score");
const livesElement = document.getElementById("lives");

const message = document.getElementById("message");
const messageTitle = document.getElementById("messageTitle");
const messageText = document.getElementById("messageText");

const restartButton =
    document.getElementById("restartButton");

const flag =
    document.getElementById("flag");

const platforms =
    Array.from(document.querySelectorAll(".platform"));

const coins =
    Array.from(document.querySelectorAll(".coin"));

const enemies =
    Array.from(document.querySelectorAll(".enemy"));


/* ESTADO */

const state = {

    x: 100,
    y: GROUND_HEIGHT,

    velocityX: 0,
    velocityY: 0,

    onGround: true,

    score: 0,
    lives: MAX_LIVES,

    running: true,

    invulnerable: false
};


const keys = {
    left: false,
    right: false
};


/* UTILIDADES */

function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
}


function getWorldRect(element) {

    return {

        left:
            parseFloat(element.style.left) || 0,

        bottom:
            parseFloat(element.style.bottom) || 0,

        width:
            element.offsetWidth,

        height:
            element.offsetHeight
    };
}


/* CONTROLES DE TECLADO */

document.addEventListener("keydown", event => {

    const key = event.key.toLowerCase();

    if (
        key === "arrowleft" ||
        key === "a"
    ) {

        keys.left = true;

        event.preventDefault();
    }

    if (
        key === "arrowright" ||
        key === "d"
    ) {

        keys.right = true;

        event.preventDefault();
    }

    if (
        key === "arrowup" ||
        key === "w" ||
        key === " "
    ) {

        jump();

        event.preventDefault();
    }
});


document.addEventListener("keyup", event => {

    const key = event.key.toLowerCase();

    if (
        key === "arrowleft" ||
        key === "a"
    ) {
        keys.left = false;
    }

    if (
        key === "arrowright" ||
        key === "d"
    ) {
        keys.right = false;
    }
});


/* PULO */

function jump() {

    if (
        !state.running ||
        !state.onGround
    ) {
        return;
    }

    state.velocityY = JUMP_POWER;

    state.onGround = false;
}


/* CONTROLES TOUCH */

function setupHoldButton(buttonId, direction) {

    const button =
        document.getElementById(buttonId);

    if (!button) {
        return;
    }

    button.addEventListener("pointerdown", event => {

        event.preventDefault();

        try {
            button.setPointerCapture(event.pointerId);
        } catch (_) {}

        if (direction === "jump") {

            jump();

        } else {

            keys[direction] = true;
        }
    });


    function release() {

        if (direction !== "jump") {
            keys[direction] = false;
        }
    }


    button.addEventListener("pointerup", release);
    button.addEventListener("pointercancel", release);
    button.addEventListener("lostpointercapture", release);
}


setupHoldButton("left", "left");
setupHoldButton("right", "right");
setupHoldButton("jump", "jump");


/* MOVIMENTO */

function updateHorizontalMovement() {

    if (keys.left && !keys.right) {

        state.velocityX = -PLAYER_SPEED;

    } else if (keys.right && !keys.left) {

        state.velocityX = PLAYER_SPEED;

    } else {

        state.velocityX *= 0.75;

        if (Math.abs(state.velocityX) < 0.1) {
            state.velocityX = 0;
        }
    }


    state.x += state.velocityX;


    state.x = clamp(
        state.x,
        0,
        WORLD_WIDTH - PLAYER_WIDTH
    );
}


/* FÍSICA VERTICAL */

function updateVerticalMovement() {

    const previousY = state.y;

    state.velocityY -= GRAVITY;

    state.y += state.velocityY;

    state.onGround = false;


    /* CHÃO */

    if (state.y <= GROUND_HEIGHT) {

        state.y = GROUND_HEIGHT;

        state.velocityY = 0;

        state.onGround = true;
    }


    /* PLATAFORMAS */

    if (state.velocityY <= 0) {

        const previousBottom = previousY;
        const currentBottom = state.y;

        const playerLeft = state.x;
        const playerRight =
            state.x + PLAYER_WIDTH;


        for (const platform of platforms) {

            const rect =
                getWorldRect(platform);

            const platformLeft =
                rect.left;

            const platformRight =
                rect.left + rect.width;

            const platformTop =
                rect.bottom + rect.height;


            const horizontalOverlap =
                playerRight > platformLeft &&
                playerLeft < platformRight;


            const crossedPlatform =
                previousBottom >= platformTop &&
                currentBottom <= platformTop;


            if (
                horizontalOverlap &&
                crossedPlatform
            ) {

                state.y = platformTop;

                state.velocityY = 0;

                state.onGround = true;

                break;
            }
        }
    }
}


/* DESENHAR NICO */

function renderPlayer() {

    player.style.left =
        `${state.x}px`;

    player.style.bottom =
        `${state.y}px`;
}


/* MOEDAS */

function collectCoins() {

    const playerLeft = state.x;
    const playerRight =
        state.x + PLAYER_WIDTH;

    const playerBottom = state.y;
    const playerTop =
        state.y + PLAYER_HEIGHT;


    for (const coin of coins) {

        if (
            coin.dataset.collected === "true"
        ) {
            continue;
        }


        const rect =
            getWorldRect(coin);

        const coinLeft =
            rect.left;

        const coinRight =
            rect.left + rect.width;

        const coinBottom =
            rect.bottom;

        const coinTop =
            rect.bottom + rect.height;


        const touching =
            playerLeft < coinRight &&
            playerRight > coinLeft &&
            playerBottom < coinTop &&
            playerTop > coinBottom;


        if (touching) {

            coin.dataset.collected = "true";

            coin.style.display = "none";

            state.score++;

            updateHUD();
        }
    }
}


/* INIMIGOS */

function checkEnemies() {

    if (state.invulnerable) {
        return;
    }


    const playerLeft = state.x;
    const playerRight =
        state.x + PLAYER_WIDTH;

    const playerBottom = state.y;
    const playerTop =
        state.y + PLAYER_HEIGHT;


    for (const enemy of enemies) {

        if (
            enemy.dataset.defeated === "true"
        ) {
            continue;
        }


        const rect =
            getWorldRect(enemy);

        const enemyLeft =
            rect.left;

        const enemyRight =
            rect.left + rect.width;

        const enemyBottom =
            rect.bottom;

        const enemyTop =
            rect.bottom + rect.height;


        const touching =
            playerLeft < enemyRight &&
            playerRight > enemyLeft &&
            playerBottom < enemyTop &&
            playerTop > enemyBottom;


        if (!touching) {
            continue;
        }


        const playerCenterX =
            state.x + PLAYER_WIDTH / 2;

        const enemyCenterX =
            enemyLeft + rect.width / 2;

        const horizontallyCentered =
            Math.abs(
                playerCenterX - enemyCenterX
            ) < 32;

        const playerWasAbove =
            playerBottom >= enemyTop - 10;


        /* PISOU NO BUBU */

        if (
            state.velocityY < 0 &&
            playerWasAbove &&
            horizontallyCentered
        ) {

            enemy.dataset.defeated = "true";

            enemy.style.display = "none";

            state.velocityY =
                JUMP_POWER * 0.65;

            state.score += 2;

            updateHUD();

            continue;
        }


        /* FOI ATINGIDO */

        loseLife();

        break;
    }
}


/* PERDER VIDA */

function loseLife() {

    if (
        !state.running ||
        state.invulnerable
    ) {
        return;
    }


    state.lives--;

    updateHUD();


    if (state.lives <= 0) {

        finishGame(
            "Fim de jogo! 💥",
            "O Nico ficou sem vidas."
        );

        return;
    }


    state.invulnerable = true;

    state.x = clamp(
        state.x - 150,
        50,
        WORLD_WIDTH - PLAYER_WIDTH
    );

    state.y = GROUND_HEIGHT;

    state.velocityX = 0;
    state.velocityY = 0;


    let flashes = 0;

    const interval =
        setInterval(() => {

            player.style.opacity =
                player.style.opacity === "0"
                    ? "1"
                    : "0";

            flashes++;

            if (flashes >= 10) {

                clearInterval(interval);

                player.style.opacity = "1";

                state.invulnerable = false;
            }

        }, 100);
}


/* BANDEIRA */

function checkFlag() {

    const rect =
        getWorldRect(flag);

    const playerLeft = state.x;
    const playerRight =
        state.x + PLAYER_WIDTH;

    const playerBottom = state.y;
    const playerTop =
        state.y + PLAYER_HEIGHT;


    const flagLeft = rect.left;
    const flagRight =
        rect.left + rect.width;

    const flagBottom = rect.bottom;
    const flagTop =
        rect.bottom + rect.height;


    const touching =
        playerLeft < flagRight &&
        playerRight > flagLeft &&
        playerBottom < flagTop &&
        playerTop > flagBottom;


    if (touching) {

        finishGame(
            "Você venceu! 🏆",
            `Nico terminou a aventura com ${state.score} pontos!`
        );
    }
}


/* CÂMERA */

function updateCamera() {

    const screenWidth =
        window.innerWidth;


    let cameraX =
        state.x -
        screenWidth * 0.4;


    const maxCamera =
        Math.max(
            0,
            WORLD_WIDTH - screenWidth
        );


    cameraX =
        clamp(
            cameraX,
            0,
            maxCamera
        );


    world.style.transform =
        `translate3d(${-cameraX}px, 0, 0)`;
}


/* HUD */

function updateHUD() {

    scoreElement.textContent =
        String(state.score);

    livesElement.textContent =
        String(state.lives);
}


/* FINAL */

function finishGame(title, text) {

    if (!state.running) {
        return;
    }

    state.running = false;

    messageTitle.textContent = title;

    messageText.textContent = text;

    message.classList.add("show");
}


/* REINICIAR SEM RECARREGAR */

function resetGame() {

    state.x = 100;
    state.y = GROUND_HEIGHT;

    state.velocityX = 0;
    state.velocityY = 0;

    state.onGround = true;

    state.score = 0;
    state.lives = MAX_LIVES;

    state.running = true;
    state.invulnerable = false;

    player.style.opacity = "1";

    coins.forEach(coin => {

        coin.dataset.collected = "false";

        coin.style.display = "";
    });


    enemies.forEach(enemy => {

        enemy.dataset.defeated = "false";

        enemy.style.display = "";
    });


    message.classList.remove("show");

    updateHUD();

    renderPlayer();

    updateCamera();
}


restartButton.addEventListener(
    "click",
    resetGame
);


/* LOOP */

function gameLoop() {

    if (state.running) {

        updateHorizontalMovement();

        updateVerticalMovement();

        renderPlayer();

        collectCoins();

        checkEnemies();

        checkFlag();

        updateCamera();
    }


    requestAnimationFrame(gameLoop);
}


/* INICIALIZAÇÃO */

updateHUD();

renderPlayer();

updateCamera();

gameLoop();

</script>
