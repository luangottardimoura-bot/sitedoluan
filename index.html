<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zombie Survival Arcade</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0a0a0c;
    color: #fff;
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }

  h1 {
    color: #ff3333;
    margin: 10px 0 5px;
    text-shadow: 0 0 10px #ff0000;
    font-size: 22px;
  }

  canvas {
    background: #15181c;
    border: 3px solid #ff3333;
    box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
    cursor: crosshair;
  }

  .hud {
    margin-top: 10px;
    font-size: 13px;
    color: #aaa;
  }

  .destaque { color: #ff3333; font-weight: bold; }
</style>
</head>
<body>

<h1>🧟 ZOMBIE SURVIVAL 🧟</h1>
<canvas id="gameCanvas" width="800" height="500"></canvas>
<div class="hud">
  WASD: Mover | <span class="destaque">Clique do Mouse: Atirar</span>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Sons com Web Audio API
const AudioContext = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioContext();

function tocarSom(freq, tipo = 'sine', duracao = 0.1, vol = 0.2) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = tipo;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duracao);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duracao);
}

// Jogador
const jogador = {
  x: canvas.width / 2,
  y: canvas.height / 2,
  raio: 15,
  velocidade: 3.5,
  angulo: 0,
  vida: 100,
  pontos: 0
};

let tiros = [];
let zumbis = [];
let teclas = {};
let posMouse = { x: 0, y: 0 };
let tempoGerarZumbi = 0;
let gameOver = false;

// Controles
document.addEventListener("keydown", e => teclas[e.key.toLowerCase()] = true);
document.addEventListener("keyup", e => teclas[e.key.toLowerCase()] = false);

canvas.addEventListener("mousemove", e => {
  const rect = canvas.getBoundingClientRect();
  posMouse.x = e.clientX - rect.left;
  posMouse.y = e.clientY - rect.top;
});

canvas.addEventListener("mousedown", e => {
  if (e.button === 0 && !gameOver) {
    atirar();
  } else if (gameOver) {
    reiniciarJogo();
  }
});

function atirar() {
  const dx = posMouse.x - jogador.x;
  const dy = posMouse.y - jogador.y;
  const angulo = Math.atan2(dy, dx);

  tiros.push({
    x: jogador.x + Math.cos(angulo) * jogador.raio,
    y: jogador.y + Math.sin(angulo) * jogador.raio,
    vx: Math.cos(angulo) * 10,
    vy: Math.sin(angulo) * 10,
    raio: 4
  });

  tocarSom(400, "square", 0.08, 0.2);
}

function criarZumbi() {
  let x, y;
  // Sorteia para aparecer nas bordas fora da tela
  if (Math.random() < 0.5) {
    x = Math.random() < 0.5 ? -20 : canvas.width + 20;
    y = Math.random() * canvas.height;
  } else {
    x = Math.random() * canvas.width;
    y = Math.random() < 0.5 ? -20 : canvas.height + 20;
  }

  const velocidade = 1 + Math.random() * 1.5;

  zumbis.push({
    x: x,
    y: y,
    raio: 14,
    velocidade: velocidade,
    vida: 2
  });
}

function atualizar() {
  if (gameOver) return;

  // Movimentação do Jogador
  if (teclas["w"] && jogador.y > jogador.raio) jogador.y -= jogador.velocidade;
  if (teclas["s"] && jogador.y < canvas.height - jogador.raio) jogador.y += jogador.velocidade;
  if (teclas["a"] && jogador.x > jogador.raio) jogador.x -= jogador.velocidade;
  if (teclas["d"] && jogador.x < canvas.width - jogador.raio) jogador.x += jogador.velocidade;

  // Ângulo de mira
  jogador.angulo = Math.atan2(posMouse.y - jogador.y, posMouse.x - jogador.x);

  // Criar zumbis periodicamente
  tempoGerarZumbi++;
  if (tempoGerarZumbi > 35) {
    criarZumbi();
    tempoGerarZumbi = 0;
  }

  // Atualizar Tiros
  for (let i = tiros.length - 1; i >= 0; i--) {
    let t = tiros[i];
    t.x += t.vx;
    t.y += t.vy;

    if (t.x < 0 || t.x > canvas.width || t.y < 0 || t.y > canvas.height) {
      tiros.splice(i, 1);
    }
  }

  // Atualizar Zumbis
  for (let i = zumbis.length - 1; i >= 0; i--) {
    let z = zumbis[i];

    // Zumbi segue o jogador
    const dx = jogador.x - z.x;
    const dy = jogador.y - z.y;
    const dist = Math.hypot(dx, dy);

    z.x += (dx / dist) * z.velocidade;
    z.y += (dy / dist) * z.velocidade;

    // Colisão Zumbi x Jogador
    if (dist < jogador.raio + z.raio) {
      jogador.vida -= 0.5;
      tocarSom(100, "sawtooth", 0.05, 0.1);

      if (jogador.vida <= 0) {
        gameOver = true;
        tocarSom(80, "sawtooth", 0.5, 0.4);
      }
    }

    // Colisão Zumbi x Tiros
    for (let j = tiros.length - 1; j >= 0; j--) {
      let t = tiros[j];
      const distTiro = Math.hypot(z.x - t.x, z.y - t.y);

      if (distTiro < z.raio + t.raio) {
        z.vida--;
        tiros.splice(j, 1);
        tocarSom(250, "sine", 0.05, 0.15);

        if (z.vida <= 0) {
          zumbis.splice(i, 1);
          jogador.pontos += 10;
        }
        break;
      }
    }
  }
}

function desenhar() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Grade do piso estilo retro
  ctx.strokeStyle = "rgba(255, 255, 255, 0.03)";
  ctx.lineWidth = 1;
  for (let x = 0; x < canvas.width; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = 0; y < canvas.height; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }

  // Desenhar Tiros
  ctx.fillStyle = "#ffff00";
  tiros.forEach(t => {
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.raio, 0, Math.PI * 2);
    ctx.fill();
  });

  // Desenhar Zumbis
  zumbis.forEach(z => {
    ctx.fillStyle = "#33cc55";
    ctx.beginPath();
    ctx.arc(z.x, z.y, z.raio, 0, Math.PI * 2);
    ctx.fill();

    // Olhos dos zumbis
    ctx.fillStyle = "#ff0000";
    ctx.beginPath();
    ctx.arc(z.x - 3, z.y - 3, 2, 0, Math.PI * 2);
    ctx.arc(z.x + 3, z.y - 3, 2, 0, Math.PI * 2);
    ctx.fill();
  });

  // Desenhar Jogador
  if (!gameOver) {
    ctx.save();
    ctx.translate(jogador.x, jogador.y);
    ctx.rotate(jogador.angulo);

    // Arma
    ctx.fillStyle = "#888";
    ctx.fillRect(0, -3, 22, 6);

    // Corpo
    ctx.fillStyle = "#00a2ff";
    ctx.beginPath();
    ctx.arc(0, 0, jogador.raio, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  // HUD / Interface
  ctx.fillStyle = "#fff";
  ctx.font = "bold 16px monospace";
  ctx.fillText(`PONTOS: ${jogador.pontos}`, 20, 30);

  // Barra de Vida
  ctx.fillStyle = "#333";
  ctx.fillRect(canvas.width - 170, 15, 150, 15);
  ctx.fillStyle = jogador.vida > 30 ? "#00ff66" : "#ff0000";
  ctx.fillRect(canvas.width - 170, 15, Math.max(0, jogador.vida * 1.5), 15);
  ctx.strokeStyle = "#fff";
  ctx.strokeRect(canvas.width - 170, 15, 150, 15);

  // Tela de Game Over
  if (gameOver) {
    ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#ff3333";
    ctx.font = "bold 45px monospace";
    ctx.fillText("FIM DE JOGO", 250, 230);

    ctx.fillStyle = "#fff";
    ctx.font = "18px monospace";
    ctx.fillText(`Pontuação Final: ${jogador.pontos}`, 280, 270);
    ctx.fillText("Clique em qualquer lugar para reiniciar", 180, 320);
  }
}

function reiniciarJogo() {
  jogador.x = canvas.width / 2;
  jogador.y = canvas.height / 2;
  jogador.vida = 100;
  jogador.pontos = 0;
  zumbis = [];
  tiros = [];
  gameOver = false;
}

function loop() {
  atualizar();
  desenhar();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
