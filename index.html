<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎣 Pesca Animada</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#jogo {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
    background: linear-gradient(
        to bottom,
        #67d9ff 0%,
        #b9efff 43%,
        #159bd3 43%,
        #075d9c 100%
    );
}

/* ☁️ Nuvens */
.nuvem {
    position: absolute;
    font-size: 70px;
    opacity: .8;
    animation: nuvem 25s linear infinite;
}

.n1 {
    top: 8%;
    left: -150px;
}

.n2 {
    top: 20%;
    left: -300px;
    animation-delay: 8s;
}

@keyframes nuvem {
    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(120vw);
    }
}

/* 🌊 Ondas */
.onda {
    position: absolute;
    top: 42%;
    left: -10%;
    width: 120%;
    height: 25px;
    background: rgba(255,255,255,.35);
    border-radius: 50%;
    animation: ondas 3s ease-in-out infinite;
}

.onda2 {
    top: 45%;
    animation-delay: 1s;
    opacity: .5;
}

@keyframes ondas {
    0%, 100% {
        transform: translateX(-20px);
    }

    50% {
        transform: translateX(20px);
    }
}

/* 🚤 Barco */
#barco {
    position: absolute;
    top: 30%;
    left: 50%;
