<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎣 Pesca em Primeira Pessoa</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #111;
}

/* CÂMERA */
#jogo {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;

    background:
        linear-gradient(
            to bottom,
            #69d8ff 0%,
            #c4f3ff 38%,
            #087eb5 39%,
            #034e7c 100%
        );
}

/* Céu */
#ceu {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.nuvem {
    position: absolute;
    font-size: 70px;
    animation: nuvem 30s linear infinite;
}

.nuvem:nth-child(1) {
    top: 8%;
    left: -150px;
}

.nuvem:nth-child(2) {
    top: 20%;
    left: -400px;
    animation-delay: 12s;
}

@keyframes nuvem {
    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(120vw);
    }
}

/* Água */
#agua {
    position: absolute;
    top: 39%;
    width: 100%;
    height: 61%;
    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.08) 0px,
            rgba(255,255,255,.08) 3px,
            transparent 3px,
            transparent 35px
        ),
        linear-gradient(#087eb5, #023b61);
}

/* Ondas */
.onda {
    position: absolute;
    width: 150%;
    height: 20px;
    left: -25%;
    border-radius: 50%;
    border-top: 4px solid rgba(255,255,255,.4);
    animation: onda 3s ease-in-out infinite;
}

.onda1 {
    top: 40%;
}

.onda2 {
    top: 47%;
    animation-delay: 1s;
}

.onda3 {
    top: 58%;
    animation-delay: 2s;
}

@keyframes onda {
    0%, 100% {
        transform: translateX(-30px);
    }

    50% {
        transform: translateX(30px);
    }
}

/* HUD */
#hud {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 50;

    color: white;
    font-size: 22px;
    font-weight: bold;

    text-shadow: 2px 2px 4px black;
}

#mensagem {
    position: absolute;
    bottom: 25px;
    width: 100%;
    text-align: center;

    color: white;
    font-size: 22px;
    font-weight: bold;

    text-shadow: 2px 2px 4px black;
    z-index: 50;
}

/* MIRA */
#mira {
    position: absolute;
    left: 50%;
    top: 52%;
    transform: translate(-50%, -50%);
    color: rgba(255,255,255,.7);
    font-size: 30px;
    z-index: 20;
}

/* PEIXES */
.peixe {
    position: absolute;
    font-size: 45px;
    cursor: pointer;
    z-index: 10;

    filter: drop-shadow(2px 3px 3px #003);
    
    animation:
        nadar 8s linear forwards,
        subir 2s ease-in-out infinite;
}

@keyframes nadar {
    from {
        transform: translateX(-150px);
    }

    to {
        transform: translateX(110vw);
    }
}

@keyframes subir {
    0%,100% {
        margin-top: 0;
    }

    50% {
        margin-top: -25px;
    }
}

.peixe:hover {
    filter:
        drop-shadow(0 0 10px yellow)
        drop-shadow(2px 3px 3px #003);
}

/* VARA EM PRIMEIRA PESSOA */
#mao {
    position: absolute;
    right: 9%;
    bottom: 7%;
    font-size: 85px;
    z-index: 30;

    transform: rotate(-12deg);
}

/* Vara */
#vara {
    position: absolute;
    width: 13px;
    height: 500px;

    right: 20%;
    bottom: -100px;

    background: linear-gradient(
        to right,
        #42200d,
        #9b5a25,
        #3d1d0b
    );

    border-radius: 10px;

    transform: rotate(-17deg);
    transform-origin: bottom;

    z-index: 25;

    animation: vara 3s ease-in-out infinite;
}

@keyframes vara {
    0%,100% {
        transform: rotate(-17deg);
    }

    50% {
        transform: rotate(-14deg) translateY(-8px);
    }
}

/* Linha */
#linha {
    position: absolute;

    width: 2px;
    height: 300px;

    right: 26%;
    bottom: 24%;

    background: white;

    transform: rotate(-2deg);

    z-index: 24;
}

/* Anzol */
#anzol {
    position: absolute;

    right: 25.3%;
    top: 61%;

    font-size: 30px;

    z-index: 25;

    animation: anzol 2s ease-in-out infinite;
}

@keyframes anzol {
    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(12px);
    }
}

/* BOTÃO */
button {
    position: absolute;
    right: 20px;
    top: 20px;

    padding: 12px 18px;

    border: none;
    border-radius: 12px;

    background: #ffd21f;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
    z-index: 60;
}

button:hover {
    background: #ffad00;
    transform: scale(1.05);
}

/* EFEITO DE CAPTURA */
.capturado {
    animation: capturado .6s forwards !important;
}

@keyframes capturado {

    0% {
        transform: scale(1);
    }

    40% {
        transform: scale(1.7) rotate(20deg);
    }

    100% {
        transform: scale(0);
        opacity: 0;
    }
}

/* FLASH */
#flash {
    position: absolute;
    inset: 0;

    background: white;

    opacity: 0;

    pointer-events: none;

    z-index: 100;
}

.flash {
    animation: flash .25s;
}

@keyframes flash {
    0% {
        opacity: .7;
    }

    100% {
        opacity: 0;
    }
}

/* BOLHAS */
.bolha {
    position: absolute;
    bottom: -30px;

    font-size: 20px;

    animation: bolha 5s linear forwards;

    z-index: 4;
}

@keyframes bolha {

    from {
        transform: translateY(0);
        opacity: .8;
    }

    to {
        transform: translateY(-100vh);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div id="jogo">

    <div id="ceu">
        <div class="nuvem">☁️</div>
        <div class="nuvem">☁️</div>
    </div>

    <div id="agua">

        <div class="onda onda1"></div>
        <div class="onda onda2"></div>
        <div class="onda onda3"></div>

    </div>

    <div id="hud">
        🎣 Pescados: <span id="pontos">0</span>
    </div>

    <button onclick="novoJogo()">
        🔄 Reiniciar
    </button>

    <div id="mira">＋</div>

    <!-- Vara em primeira pessoa -->
    <div id="vara"></div>
    <div id="linha"></div>
    <div id="anzol">🪝</div>
    <div id="mao">🖐️</div>

    <div id="mensagem">
        Clique em um peixe para pescar!
    </div>

    <div id="flash"></div>

</div>

<script>

let pontos = 0;
let peixes = [];

const jogo = document.getElementById("jogo");
const placar = document.getElementById("pontos");
const mensagem = document.getElementById("mensagem");
const flash = document.getElementById("flash");

const tiposPeixes = [
    "🐟",
    "🐠",
    "🐡",
    "🐟",
    "🐠"
];

/* Criar peixe */
function criarPeixe() {

    const peixe = document.createElement("div");

    peixe.className = "peixe";

    peixe.textContent =
        tiposPeixes[
            Math.floor(Math.random() * tiposPeixes.length)
        ];

    /*
       O peixe nasce somente na água.
    */
    peixe.style.top =
        (45 + Math.random() * 45) + "%";

    peixe.style.left = "-100px";

    peixe.style.animationDuration =
        (5 + Math.random() * 6) + "s";

    jogo.appendChild(peixe);

    peixes.push(peixe);

    /* Pescar */
    peixe.addEventListener("click", function() {

        if (peixe.classList.contains("capturado"))
            return;

        pontos++;

        placar.textContent = pontos;

        peixe.classList.add("capturado");

        mensagem.textContent =
            "🎉 PEIXE PESCADO!";

        /*
           Faz a vara tremer
        */
        document.getElementById("vara").style.animation =
            "none";

        setTimeout(() => {

            document.getElementById("vara").style.animation =
                "vara .3s ease-in-out 4";

        }, 10);

        /* Flash */
        flash.classList.remove("flash");

        void flash.offsetWidth;

        flash.classList.add("flash");

        setTimeout(() => {

            peixe.remove();

            peixes =
                peixes.filter(p => p !== peixe);

        }, 600);

        /* Cria outro */
        setTimeout(criarPeixe, 700);
    });

    /* Remove peixe que saiu da tela */
    setTimeout(() => {

        if (document.body.contains(peixe)) {

            peixe.remove();

            peixes =
                peixes.filter(p => p !== peixe);

        }

    }, 12000);
}

/* Bolhas */
function criarBolha() {

    const bolha =
        document.createElement("div");

    bolha.className = "bolha";

    bolha.textContent = "🫧";

    bolha.style.left =
        Math.random() * 100 + "%";

    jogo.appendChild(bolha);

    setTimeout(() => {
        bolha.remove();
    }, 5000);
}

/* Novo jogo */
function novoJogo() {

    pontos = 0;

    placar.textContent = "0";

    peixes.forEach(peixe =>
        peixe.remove()
    );

    peixes = [];

    mensagem.textContent =
        "Clique em um peixe para pescar!";

    for (let i = 0; i < 8; i++) {

        setTimeout(
            criarPeixe,
            i * 700
        );

    }
}

/* Bolhas constantes */
setInterval(criarBolha, 800);

/* Começar */
novoJogo();

</script>

</body>
</html>
